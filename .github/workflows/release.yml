name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build, test, attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify tag resolves to checked-out commit
        shell: bash
        run: |
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [[ -z "$TAG_COMMIT" || "$HEAD_COMMIT" != "$TAG_COMMIT" ]]; then
            echo "Release tag does not resolve to checked-out commit" >&2
            echo "tag=$TAG_COMMIT head=$HEAD_COMMIT" >&2
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify package version matches release tag
        shell: bash
        run: |
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          if [[ "$PROJECT_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Release tag/package version mismatch" >&2
            echo "tag=$EXPECTED_VERSION package=$PROJECT_VERSION" >&2
            exit 1
          fi

      - name: Install release tooling
        run: python -m pip install --upgrade pip build pytest

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run release tests
        run: python -m pytest -q

      - name: Build artifacts
        run: python -m build --outdir dist

      - name: Attest artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --generate-notes \
            --verify-tag
